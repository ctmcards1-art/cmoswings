name: Unzip site files
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded site
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z"
            git rm -q "$z"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unzip site files" || exit 0
          git push
